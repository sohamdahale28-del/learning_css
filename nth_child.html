<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul{
            width:200px;
            padding:20px;
            list-style-type:none;
            font-weight: 900;
        }
        li{ 
            color:white;
            padding:15px;
            border:3px solid green;
            margin-top:5px;
            border-radius:10px;
            
        }
        /* li:nth-child(even){
            background-color: brown; */
        
        /* li:nth-child(odd){
             background-color:black;
             color:red; */
        
        li:last-child{
            background-color:blue;
        }
        li:nth-child(6){
            background-color:aqua;
        }
        li:first-child{
            background-color: blueviolet;
        }
    </style>
</head>
<body>
    <ul>
        <li>items1</li>
        <li>items2</li>
        <li>items3</li>
        <li>items4</li>
        <li >items5</li>
        <li>items6</li>
        <li >items7</li>
        <li>items8</li>
    </ul>
</body>
</html>
