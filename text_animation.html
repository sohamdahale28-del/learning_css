<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         .text-container{
            display: flex;
            justify-content: center;
            font-family:Georgia, 'Times New Roman', Times, serif;
            font-size: 100px;
            font-weight:700px;
            letter-spacing:10px;
            padding:200px;
         }
         .text-container > b {
            height:120px;
            box-shadow: 5px 2px 5px 2px black;
            background:linear-gradient(to right,red ,black,blue);
            background-clip: text;
            color:transparent;
            transform-origin:center;
            animation:updown 10s infinite;
         }
        .text-container>:nth-child(1){animation-delay:0;}
        .text-container>:nth-child(2){animation-delay:0.25s;}
        .text-container>:nth-child(3){animation-delay:0.50s;}
        .text-container>:nth-child(4) {animation-delay: 0.75s;}
        .text-container>:nth-child(5){animation-delay:1s;}
        
        @keyframes updown{
            from{transform:rotate(7200deg)}
            10%,50%{transform:rotate(0deg)}
            60%,to{transform:rotate(7200deg)}
        }
    </style>
</head>
<body>
    <div class="text-container">
    <b>S</b><b>O</b><b>H</b><b>A</b><b>M</b>
    </div>
    
</body>
</html>
