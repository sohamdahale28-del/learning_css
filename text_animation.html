<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         .text-container{
            display: flex;
            background-color: rgb(223, 214, 214);
            justify-content: center;
            font-family:Georgia, 'Times New Roman', Times, serif;
            font-size: 100px;
            font-weight:700px;
            letter-spacing:10px;
            padding:200px;
         }
         .text-container > b {
            height:120px;
            box-shadow: 5px 2px 5px 2px rgb(26, 26, 27);
            background:linear-gradient(to right,#a1f29c ,rgb(156, 117, 117),rgb(226, 95, 187));
            background-clip: text;
            color:transparent;
            transform-origin:center;
            animation:updown 10s infinite;
         }
        .text-container>:nth-child(1){animation-delay:0;}
        .text-container>:nth-child(2){animation-delay:0.25s;}
        .text-container>:nth-child(3){animation-delay:0.50s;}
        .text-container>:nth-child(4) {animation-delay: 0.75s;}
        .text-container>:nth-child(5){animation-delay:1s;}
        
        @keyframes updown{
            from{transform:rotate(7200deg)}
            10%,50%{transform:rotate(0deg)}
            60%,to{transform:rotate(7200deg)}
        }
        .s_animation{
        display : flex;
        background-color: black;
            justify-content: center;
            font-family:Georgia, 'Times New Roman', Times, serif;
            font-size: 100px;
            font-weight:700px;
            letter-spacing:10px;
            padding:200px;
        }
            
       .s_animation>:nth-child(1){animation-delay:0;}
        .s_animation>:nth-child(2){animation-delay:0.25s;}
        .s_animation>:nth-child(3){animation-delay:0.50s;}
        .s_animation>:nth-child(4) {animation-delay: 0.75s;}
        .s_animation>:nth-child(5){animation-delay:1s;}
          
        .s_animation> b {
            background-color: black;
            height:120px;
            box-shadow: 5px 2px 5px 2px rgb(77, 229, 189);
            background:linear-gradient(to right,rgb(223, 92, 92) ,rgb(77, 229, 189));
            background-clip: text;
            color:transparent;
            transform-origin:center;
            animation:updown 10s infinite;
         }
 @keyframes updown{
             from{transform:skew(360deg)}
            10%,50%{transform:skew(0deg)}
            60%,to{transform:skew(360deg)}
            
        }
         
        
    </style>
</head>
<body>
    <div class="text-container">
    <b>S</b><b>O</b><b>H</b><b>A</b><b>M</b>
    </div>
    <div class="s_animation">
        <b>S</b><b>O</b><b>H</b><b>A</b><b>M</b> 
        <b>D</b><b>A</b><b>H</b><b>A</b><b>L</b><b>E</b>
    </div>
</body>
</html>
